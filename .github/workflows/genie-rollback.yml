# Rollback (run by hand from the Actions tab): restore an earlier version to one environment
#
#   to    = previous                       the release before the latest genie-prod-* tag
#         = <git tag or commit>            e.g. genie-prod-20261001.0915-1a2b3c4, or genie-dev-snapshot-<time>
#   what  = genie-space  (default)  only resources/freshcart_assistant.space.yml, deployed with today's Genie bundle
#         = genie-bundle            the whole genie_bundle/ folder as it was (space, gate job, permissions)
#         = data-bundle             the whole databricks/ folder as it was (pipeline, refresh job, SQL), then a refresh
#         = everything              both bundles as they were, data first
#
# It is a normal `databricks bundle deploy`, approved like any prod deploy, and the live Genie space is backed up
# first. Afterwards, fix forward on main (for example `git revert`) so the next release doesn't bring the bad
# version back.
name: genie-rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [prod, qa, dev]
        required: true
      to:
        description: "previous | <git tag or commit>"
        default: previous
        required: true
      what:
        description: What to restore
        type: choice
        options: [genie-space, genie-bundle, data-bundle, everything]
        default: genie-space
      refresh_data:
        description: After restoring the data bundle, rebuild the data (run freshcart_refresh)
        type: boolean
        default: true
      reason:
        description: Why (kept in the run log)
        required: true

concurrency:
  group: genie-release
  cancel-in-progress: false

permissions:
  contents: write                              # move the tag genie-deployed-<environment>
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
      TARGET: ${{ inputs.environment }}        # inputs reach the shell as variables, never as code
      ROLLBACK_TO: ${{ inputs.to }}
      WHAT: ${{ inputs.what }}
      REFRESH: ${{ inputs.refresh_data }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
        with:
          version: "1.18.0"
      - run: pip install -r genie_bundle/requirements-dev.txt
      - name: Resolve the version to restore
        run: |
          echo "Rollback of $TARGET ($WHAT) to '$ROLLBACK_TO' requested by $GITHUB_ACTOR: $REASON"
          if [ "$ROLLBACK_TO" = "previous" ]; then
            REF=$(git tag -l 'genie-prod-*' --sort=-refname | sed -n 2p)
            [ -n "$REF" ] || { echo "::error::there is no earlier genie-prod-* release"; exit 1; }
          else
            REF="$ROLLBACK_TO"
          fi
          git rev-parse --verify "$REF^{commit}" >/dev/null
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "Restoring $WHAT in $TARGET to $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out that version
        run: |
          case "$WHAT" in
            genie-space)  git checkout "$REF" -- genie_bundle/resources/freshcart_assistant.space.yml ;;
            genie-bundle) git checkout "$REF" -- genie_bundle ;;
            data-bundle)  git checkout "$REF" -- databricks ;;
            everything)   git checkout "$REF" -- databricks genie_bundle ;;
          esac
          git status --short
      - name: Data bundle
        if: inputs.what == 'data-bundle' || inputs.what == 'everything'
        working-directory: databricks
        run: |
          databricks bundle plan -t "$TARGET"
          databricks bundle deploy -t "$TARGET"
          if [ "$REFRESH" = "true" ]; then databricks bundle run freshcart_refresh -t "$TARGET"; fi
      - name: Genie plan and backup of the live space
        if: inputs.what != 'data-bundle'
        working-directory: genie_bundle
        run: |
          databricks bundle plan -t "$TARGET"
          databricks bundle plan -t "$TARGET" -o json > plan.json
          python scripts/check_drift.py plan.json -t "$TARGET" --backup-dir backup --allow-drift
      - if: inputs.what != 'data-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: genie-${{ inputs.environment }}-pre-rollback-${{ github.run_id }}
          path: |
            genie_bundle/plan.json
            genie_bundle/backup/
          retention-days: 400
      - name: Deploy the restored Genie version
        if: inputs.what != 'data-bundle'
        working-directory: genie_bundle
        run: databricks bundle deploy -t "$TARGET"
      - name: Record what the environment runs
        if: inputs.what != 'data-bundle'
        run: git tag -f "genie-deployed-$TARGET" "$REF" && git push -f origin "genie-deployed-$TARGET"
      - name: Smoke test
        if: inputs.environment != 'dev' && inputs.what != 'data-bundle'
        working-directory: genie_bundle
        run: databricks bundle run genie_quality_gate -t "$TARGET" --params mode=smoke
