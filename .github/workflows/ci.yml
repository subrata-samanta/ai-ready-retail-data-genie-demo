name: demo
on:
  push:
  pull_request:
jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main            # for the Genie bundle integration test
        with:
          version: "1.18.0"
      - run: pip install -r requirements.txt -r genie_bundle/requirements-dev.txt
      - name: Pipeline, checks, benchmarks, docs
        run: python run_demo.py
      - name: Tests (pipeline, docs, and the Genie bundle with the real Databricks CLI against a stand-in workspace)
        run: python tests/run_tests.py
      - name: Docs are up to date
        run: git diff --exit-code -- docs README.md databricks
