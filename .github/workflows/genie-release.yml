# Release of the whole FreshCart product: main -> dev -> qa (gates) -> prod (approval)
#
# Each environment gets, from the SAME commit:
#   1. the data bundle  (databricks/):   bundle deploy, then bundle run freshcart_refresh (pipeline, gold,
#                                        security, semantic layer and the data health checks)
#   2. the Genie bundle (genie_bundle/): bundle plan -> check_drift.py (refuses to overwrite UI edits in qa/prod,
#                                        refuses to delete or recreate the space, keeps a backup) -> bundle deploy
#   qa:   the Genie benchmark gate (bundle run genie_quality_gate) and a smoke test must pass
#   prod: waits for an approval (required reviewers on the GitHub environment prod), then deploys,
#         smoke-tests (restoring the previous Genie space if that fails) and tags the release genie-prod-<UTC>-<sha>
#
# One-time setup: notebooks/FreshCart_CICD_Dev_to_Prod_with_DAB_and_GitHub (part B).
#   GitHub environments dev, qa, prod with variables DATABRICKS_HOST and DATABRICKS_CLIENT_ID (the environment's
#   deployment service principal). Sign-in: GitHub OIDC with a Databricks federation policy (no secret stored),
#   or, if the environment has the secret DATABRICKS_CLIENT_SECRET, an OAuth secret of the service principal.
# Until DATABRICKS_HOST is set for an environment, its steps are skipped with a notice.
name: genie-release

on:
  push:
    branches: [main]
    paths:
      - "genie_bundle/**"
      - "databricks/**"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Run the data refresh job after deploying the data bundle
        type: boolean
        default: true
      allow_drift:
        description: Overwrite edits made in the qa/prod UI since the last deploy (a backup is kept)
        type: boolean
        default: false
      allow_destroy:
        description: Allow a plan that deletes or recreates the Genie space (its conversations are lost)
        type: boolean
        default: false

concurrency:
  group: genie-release                         # shared with genie-rollback: one deployment at a time
  cancel-in-progress: false

permissions:
  contents: write                              # push release tags
  id-token: write                              # GitHub OIDC token for Databricks
  pull-requests: write                         # the dev snapshot may open a sync PR

env:
  DATABRICKS_CLI_VERSION: "1.18.0"
  DRIFT_FLAGS: ${{ inputs.allow_drift && '--allow-drift' || '' }} ${{ inputs.allow_destroy && '--allow-destroy' || '' }}
  REFRESH: ${{ inputs.refresh_data != false }}   # pushes have no inputs: refresh

jobs:
  # 1. Capture any UI edits in dev into git before dev is redeployed (nothing is ever lost).
  dev-snapshot:
    uses: ./.github/workflows/genie-dev-sync.yml
    secrets: inherit

  # 2. Dev: data, then Genie.
  dev:
    needs: dev-snapshot
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then echo "::notice::dev is not connected (no DATABRICKS_HOST); skipping"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Data bundle
        if: steps.cfg.outputs.ready == 'true'
        working-directory: databricks
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
          if [ "$REFRESH" = "true" ]; then databricks bundle run freshcart_refresh -t dev; fi
      - name: Genie bundle
        if: steps.cfg.outputs.ready == 'true'
        working-directory: genie_bundle
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev

  # 3. QA: data, then Genie with drift gate, benchmark gate and smoke test.
  qa:
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      gated: ${{ steps.gate.outcome == 'success' }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - run: pip install -r genie_bundle/requirements-dev.txt
      - id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then echo "::notice::qa is not connected (no DATABRICKS_HOST); skipping"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Data bundle (deploy, refresh, health checks)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: databricks
        run: |
          databricks bundle validate -t qa
          databricks bundle deploy -t qa
          if [ "$REFRESH" = "true" ]; then databricks bundle run freshcart_refresh -t qa; fi
      - name: Genie plan, drift gate and backup of the live space
        if: steps.cfg.outputs.ready == 'true'
        working-directory: genie_bundle
        run: |
          databricks bundle validate -t qa
          databricks bundle plan -t qa
          databricks bundle plan -t qa -o json > plan.qa.json
          python scripts/check_drift.py plan.qa.json -t qa --backup-dir backup $DRIFT_FLAGS
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genie-qa-pre-deploy-${{ github.run_id }}
          path: |
            genie_bundle/plan.qa.json
            genie_bundle/backup/
          retention-days: 90
      - name: Genie deploy
        if: steps.cfg.outputs.ready == 'true'
        working-directory: genie_bundle
        run: databricks bundle deploy -t qa
      - id: gate
        name: Benchmark gate (bundle job)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: genie_bundle
        run: databricks bundle run genie_quality_gate -t qa
      - name: Smoke test (bundle job)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: genie_bundle
        run: databricks bundle run genie_quality_gate -t qa --params mode=smoke

  # 4. Prod: same commit, after approval (required reviewers on the prod environment).
  prod:
    needs: qa
    if: needs.qa.outputs.gated == 'true'       # never without a passed qa gate
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # release tags, for the automatic restore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - run: pip install -r genie_bundle/requirements-dev.txt
      - name: Data bundle (deploy, refresh, health checks)
        working-directory: databricks
        run: |
          databricks bundle validate -t prod
          databricks bundle deploy -t prod
          if [ "$REFRESH" = "true" ]; then databricks bundle run freshcart_refresh -t prod; fi
      - name: Genie plan, drift gate and backup of the live space
        working-directory: genie_bundle
        run: |
          databricks bundle validate -t prod
          databricks bundle plan -t prod
          databricks bundle plan -t prod -o json > plan.prod.json
          python scripts/check_drift.py plan.prod.json -t prod --backup-dir backup $DRIFT_FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: genie-prod-pre-deploy-${{ github.run_id }}
          path: |
            genie_bundle/plan.prod.json
            genie_bundle/backup/
          retention-days: 400
      - name: Genie deploy
        working-directory: genie_bundle
        run: databricks bundle deploy -t prod
      - name: Smoke test (restores the previous Genie space if it fails)
        working-directory: genie_bundle
        run: |
          if ! databricks bundle run genie_quality_gate -t prod --params mode=smoke; then
            PREVIOUS=$(git tag -l 'genie-prod-*' --sort=-refname | head -n 1)
            echo "::error::smoke test failed on prod; restoring the space from ${PREVIOUS:-nothing}"
            if [ -n "$PREVIOUS" ]; then
              git checkout "$PREVIOUS" -- resources/freshcart_assistant.space.yml
              databricks bundle deploy -t prod
            fi
            exit 1
          fi
      - name: Tag the release
        run: |
          TAG="genie-prod-$(date -u +%Y%m%d.%H%M)-${GITHUB_SHA::7}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Released $TAG (data bundle and Genie bundle)" >> "$GITHUB_STEP_SUMMARY"
