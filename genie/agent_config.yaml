# FreshCart Sales & Stock Assistant: Genie Agent configuration
# ---------------------------------------------------------------------------------------
# This file documents every setting to enter in the Genie Agent UI (Configure > ...).
# It is written to be reviewed in pull requests like code. Enter it in the UI, or use it
# as the source for a Declarative Automation Bundle / the Genie API when you automate.

title: FreshCart Sales & Stock Assistant

description: |
  Ask about sales, margin, baskets, promotions, loyalty and stock across FreshCart stores
  and online. Figures are USD, exclude tax and use the FreshCart fiscal calendar.
  You only see regions you have access to; if a question returns no rows, you may not
  have access to that region. Not covered: labour, supplier deliveries, individual customers.

warehouse: serverless SQL warehouse (recommended for Genie; pro also works)

common_questions:
  - What were net sales and margin by region last week?
  - How are we trading year to date versus last year?
  - What is like-for-like growth this year by region?
  - Where are we out of stock most in fresh?

# Configure > Sources. Keep it small: 4 objects + 1 function.
data_sources:
  - object: freshcart.semantic.sales_metrics
    why: All sales, margin, basket, promotion and loyalty questions
  - object: freshcart.semantic.inventory_metrics
    why: Stock and availability questions
  - object: freshcart.gold.dim_store
    why: Store lookups (openings, formats, square footage) and entity matching on store names, cities, regions
  - object: freshcart.gold.dim_product
    why: Product lookups (own-brand ranges, discontinued lines) and entity matching on categories, subcategories, brands
functions:
  - freshcart.semantic.fn_like_for_like_sales

# Configure > Sources > (table) > columns
hidden_columns:
  freshcart.gold.dim_store: [comparable_from_fiscal_year]   # use is_comparable_store or the LFL function instead

entity_matching:
  enabled:
    freshcart.gold.dim_store: [store_name, city, state_province, region, store_format]
    freshcart.gold.dim_product: [department, category, subcategory, brand]
  disabled:
    - column: metric view columns
      reason: >-
        The metric views read fct_sales_line and fct_inventory_daily, which carry row filters.
        Entity matching must be off for views over filtered tables, so it runs on the
        unfiltered dimension tables instead.
    - column: freshcart.gold.dim_product.product_name
      reason: >-
        Entity matching stores up to 1,024 distinct values per column. A real product list is
        much longer, so product questions use the parameterized example 06 instead.

join_relationships: none needed. The metric views carry their own joins; the dimensions are used for lookups.

# Configure > Examples > Add > Filter / Field. Business terms that are not KPIs.
# No measures here on purpose: every KPI lives in the metric view only, so nothing can conflict.
sql_expressions:
  - type: filter
    name: Fresh departments
    code: department IN ('Produce', 'Bakery', 'Meat and Seafood', 'Deli', 'Dairy and Eggs')
    synonyms: [fresh, perishables, fresh food]
    instructions: Apply when users ask about fresh or perishable products.
  - type: filter
    name: Comparable stores
    code: is_comparable_store = true
    synonyms: [comp stores, LFL stores, same stores]
    instructions: Apply for comparable-store breakdowns. For like-for-like growth use fn_like_for_like_sales.
  - type: field
    name: Day type
    code: CASE WHEN day_of_week_name IN ('Saturday', 'Sunday') THEN 'Weekend' ELSE 'Weekday' END
    synonyms: [weekend vs weekday]
    instructions: Use when users compare weekends with weekdays.

# Configure > Examples > Add > SQL query. Title = the way users ask.
example_queries:
  - file: example_queries/01_net_sales_and_margin_by_region_last_week.sql
    title: What were net sales and margin by region last week?
    usage_guidance: Last week always means the last completed fiscal week, Sunday to Saturday.
  - file: example_queries/02_ytd_vs_last_year.sql
    title: How are we trading year to date versus last year?
    usage_guidance: Total business comparison. For comparable-store growth use fn_like_for_like_sales.
  - file: example_queries/03_store_week_by_week.sql
    title: How did a store trade week by week in a fiscal year?
    parameters:
      - {name: store_name, type: String, comment: "Exact store name from dim_store, for example FreshCart Boston Seaport"}
      - {name: fiscal_year, type: Integer, comment: "Fiscal year such as 2026; default to the current fiscal year"}
  - file: example_queries/04_promo_reliance_by_category_this_quarter.sql
    title: Which categories rely most on promotions this quarter?
  - file: example_queries/05_out_of_stock_fresh_last_4_weeks.sql
    title: Where are we out of stock most often in fresh?
  - file: example_queries/06_product_across_regions.sql
    title: How does a product sell across regions?
    parameters:
      - {name: product_search, type: String, comment: "Part of a product name, for example chips"}

# Configure > Instructions > Text
general_instructions_file: general_instructions.md

benchmarks_file: benchmarks.yaml
