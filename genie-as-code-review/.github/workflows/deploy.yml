# =============================================================================
# Genie-as-Code CI/CD — FreshCart Sales & Stock Assistant (simple version)
#
# Trigger map:
#   PR opened/updated            → validate only (catches schema errors before merge)
#   Push to main                 → validate → deploy dev + smoke test → deploy QA + benchmark gate
#   Manual dispatch, target=dev  → validate → dev
#   Manual dispatch, target=qa   → validate → dev → QA
#   Manual dispatch, target=prod → validate → dev → QA → prod (prod waits for approval)
#   Prod is only ever deployed by a manual dispatch, and only after the QA gate passed
#   on the same commit.
#
# Auth: one service principal per environment, stored as GitHub secrets
# (DEV_/QA_/PROD_SP_CLIENT_ID, DEV_/QA_/PROD_SP_CLIENT_SECRET) and the workspace URLs
# as GitHub variables (DEV_/QA_/PROD_DATABRICKS_HOST). The CLI and the SDK pick up
# DATABRICKS_HOST + CLIENT_ID + CLIENT_SECRET automatically.
# Pull requests from forks get no secrets, so their validate job fails.
#
# This file belongs at .github/workflows/ of a repository whose root is this folder.
# =============================================================================

name: Deploy Genie Space

on:
  pull_request:
    branches: [main]
    paths:
      - "databricks.yml"
      - "resources/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "databricks.yml"
      - "resources/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy up to this target (dev → qa → prod)"
        required: true
        default: dev
        type: choice
        options: [dev, qa, prod]

# One deployment at a time; a newer run waits instead of cancelling one that is half done.
concurrency:
  group: deploy-genie-space
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate — runs on every PR, push and dispatch
  #    Catches schema errors, unknown fields, and unresolvable variables
  #    before any deployment happens.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0

      - name: Space JSON is valid
        run: python3 -m json.tool src/freshcart_assistant.geniespace.json > /dev/null

      - name: bundle validate (dev)
        run: databricks bundle validate -t dev

  # ---------------------------------------------------------------------------
  # 2. Deploy to dev — on push to main, and on every manual dispatch
  #    development mode prefixes the space name with the deployer, so the CI
  #    copy ("[dev <service principal>] ...") never clobbers a developer's own.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy → dev + smoke test
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk --quiet

      - name: bundle deploy -t dev
        run: databricks bundle deploy -t dev

      - name: Smoke test (conversation API)
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t dev -o json \
            | jq -r '.resources.genie_spaces.freshcart_assistant.id')
          python tests/test_genie.py

  # ---------------------------------------------------------------------------
  # 3. Deploy to QA — after dev, on push to main or a dispatch to qa/prod
  #    Runs the native Genie benchmark evaluation after deploy.
  #    The "qa" GitHub environment can require a reviewer approval before
  #    this job starts (Settings → Environments → qa → Required reviewers).
  # ---------------------------------------------------------------------------
  deploy-qa:
    name: Deploy → QA + benchmark gate
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'dev')
    environment: qa
    env:
      DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.QA_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.QA_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk --quiet

      - name: Point the space at the QA catalog
        run: bash scripts/set_catalog.sh qa

      - name: bundle deploy -t qa
        run: databricks bundle deploy -t qa

      # Benchmark gate: runs every benchmark question in the QA space and compares
      # Genie's answers with the expected SQL (live in this workspace). Fails the job
      # if accuracy on the automatically graded benchmarks is below the threshold.
      - name: Genie benchmark gate
        env:
          ACCURACY_THRESHOLD: "0.60"   # 60% of the graded benchmark questions must be "Good"
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t qa -o json \
            | jq -r '.resources.genie_spaces.freshcart_assistant.id')
          python tests/benchmark_gate.py

  # ---------------------------------------------------------------------------
  # 4. Deploy to prod — manual dispatch with target=prod only, after the QA
  #    gate passed in the same run. Requires approval via the "prod" GitHub
  #    environment (Settings → Environments → prod → Required reviewers).
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    environment: prod   # ← manual approval gate lives here
    env:
      DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.PROD_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk --quiet

      - name: Point the space at the prod catalog
        run: bash scripts/set_catalog.sh prod

      - name: bundle deploy -t prod
        run: databricks bundle deploy -t prod

      - name: Smoke test (conversation API)
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t prod -o json \
            | jq -r '.resources.genie_spaces.freshcart_assistant.id')
          python tests/test_genie.py
