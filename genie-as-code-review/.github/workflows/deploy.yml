# =============================================================================
# Genie-as-Code CI/CD — Finance & P&L
#
# Trigger map:
#   PR opened/updated  → validate only (catches schema errors before merge)
#   Push to main       → validate → deploy dev → deploy QA (with eval-run gate)
#   Manual dispatch    → deploy to any target, optionally promote to prod
#
# Auth: one service principal per environment, stored as GitHub secrets.
# The profile: lines in databricks.yml are for LOCAL use only — CI
# authenticates via DATABRICKS_HOST + CLIENT_ID + CLIENT_SECRET env vars,
# which the CLI picks up automatically (no profile needed).
# =============================================================================

name: Deploy Genie Space

on:
  pull_request:
    branches: [main]
    paths:
      - "databricks.yml"
      - "resources/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "databricks.yml"
      - "resources/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, qa, prod]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate — runs on every PR and every push to main
  #    Catches schema errors, unknown fields, and unresolvable variables
  #    before any deployment happens.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main   # installs latest; pin to a version for stability

      - name: bundle validate (dev)
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
        run: databricks bundle validate -t dev

  # ---------------------------------------------------------------------------
  # 2. Deploy to dev — runs on push to main only
  #    development mode prefixes the space name per deployer so team members
  #    don't clobber each other. In CI there is one fixed "ci" identity so
  #    this just produces "[dev ci] Finance & P&L Analytics".
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
        run: databricks bundle deploy -t dev

      - name: Smoke test (conversation API)
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
        run: |
          pip install databricks-sdk --quiet
          SPACE_ID=$(databricks bundle summary -t dev -o json \
            | jq -r '.resources.genie_spaces.finance_pnl.id')
          echo "DEV_SPACE_ID=$SPACE_ID" >> $GITHUB_ENV
          GENIE_SPACE_ID=$SPACE_ID python tests/test_genie.py

  # ---------------------------------------------------------------------------
  # 3. Deploy to QA — runs after dev succeeds on push to main
  #    Runs the native Genie eval-run benchmark gate after deploy.
  #    The "qa" GitHub environment can require a reviewer approval before
  #    this job starts (Settings → Environments → qa → Required reviewers).
  # ---------------------------------------------------------------------------
  deploy-qa:
    name: Deploy → QA + benchmark gate
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'qa')
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: bundle deploy -t qa
        env:
          DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.QA_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.QA_SP_CLIENT_SECRET }}
        run: databricks bundle deploy -t qa

      # Benchmark gate: runs all benchmark questions in the QA space,
      # compares result sets against the answer SQL (live in this workspace),
      # and fails the job if accuracy drops below threshold or a question that
      # passed in dev now fails in QA (environment regression).
      - name: Genie benchmark gate
        env:
          DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.QA_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.QA_SP_CLIENT_SECRET }}
          ACCURACY_THRESHOLD: "0.90"   # 90% of benchmark questions must be "Good"
        run: |
          pip install databricks-sdk --quiet

          QA_SPACE_ID=$(databricks bundle summary -t qa -o json \
            | jq -r '.resources.genie_spaces.finance_pnl.id')

          python - <<'PY'
          import os, time
          from databricks.sdk import WorkspaceClient

          w = WorkspaceClient()
          space_id = os.environ["QA_SPACE_ID"]
          threshold = float(os.environ.get("ACCURACY_THRESHOLD", "0.90"))

          # Start eval run against all benchmark questions
          run = w.genie.genie_create_eval_run(space_id)
          print(f"Eval run started: {run.eval_run_id}")

          # Poll until complete
          while True:
              status = w.genie.genie_get_eval_run(space_id, run.eval_run_id)
              print(f"  status: {status.state}")
              if status.state in ("COMPLETED", "FAILED", "CANCELLED"):
                  break
              time.sleep(10)

          # Collect per-question results
          results = list(w.genie.genie_list_eval_results(space_id, run.eval_run_id))
          total = len(results)
          passed = sum(1 for r in results if getattr(r, "rating", None) == "GOOD")
          accuracy = passed / total if total else 0

          print(f"\nBenchmark results: {passed}/{total} Good ({accuracy*100:.1f}%)")
          for r in results:
              status_icon = "✅" if getattr(r, "rating", None) == "GOOD" else "❌"
              print(f"  {status_icon} {getattr(r, 'question', r)}")

          if accuracy < threshold:
              raise SystemExit(
                  f"GATE FAILED: accuracy {accuracy*100:.1f}% < threshold {threshold*100:.0f}%"
              )
          print(f"\nGate passed — deploying to prod is safe.")
          PY
        env:
          QA_SPACE_ID: ${{ env.QA_SPACE_ID }}

  # ---------------------------------------------------------------------------
  # 4. Deploy to prod — requires manual approval via the "prod" GitHub
  #    environment (Settings → Environments → prod → Required reviewers).
  #    Only runs after the QA benchmark gate passes.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod   # ← manual approval gate lives here
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.PROD_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_SP_CLIENT_SECRET }}
        run: databricks bundle deploy -t prod
