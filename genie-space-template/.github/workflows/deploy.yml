# =============================================================================
# Genie space CI/CD: validate -> dev (smoke test) -> QA (benchmark gate) -> prod (approval)
#
# Trigger map:
#   PR opened/updated            → validate only (space checks + bundle validate)
#   Push to main                 → validate → deploy dev + smoke test → deploy QA + benchmark gate
#   Manual dispatch, target=dev  → validate → dev
#   Manual dispatch, target=qa   → validate → dev → QA
#   Manual dispatch, target=prod → validate → dev → QA → prod (prod waits for approval)
#   Prod is only ever deployed by a manual dispatch, and only after the QA gate passed on the same commit.
#   adopt_space_id (first prod release only): prod takes over an existing space instead of creating one.
#
# Repository settings (README.md, step 6):
#   Variables  DEV_DATABRICKS_HOST, QA_DATABRICKS_HOST, PROD_DATABRICKS_HOST   (workspace URLs)
#   Secrets    DEV_/QA_/PROD_SP_CLIENT_ID, DEV_/QA_/PROD_SP_CLIENT_SECRET      (one service principal each)
#   Environments dev, qa, prod   (prod with required reviewers)
# The CLI and the SDK pick up DATABRICKS_HOST + CLIENT_ID + CLIENT_SECRET automatically.
#
# This file belongs at .github/workflows/ of a repository whose root is this folder.
# =============================================================================

name: Deploy Genie Space

on:
  pull_request:
    branches: [main]
    paths: ["databricks.yml", "resources/**", "src/**", "scripts/**", "tests/**", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths: ["databricks.yml", "resources/**", "src/**", "scripts/**", "tests/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy up to this target (dev → qa → prod)"
        required: true
        default: dev
        type: choice
        options: [dev, qa, prod]
      adopt_space_id:
        description: "First prod release only: id of an existing space that prod should take over in place"
        required: false
        default: ""
        type: string

# One deployment at a time; a newer run waits instead of cancelling one that is half done.
concurrency:
  group: deploy-genie-space
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml --quiet

      - name: Space checks
        run: python scripts/check_space.py

      - name: bundle validate (dev)
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy → dev + smoke test
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml --quiet

      - name: bundle deploy -t dev
        run: databricks bundle deploy -t dev

      - name: Smoke test (conversation API)
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t dev -o json \
            | jq -r '.resources.genie_spaces.genie_space.id')
          python tests/smoke_test.py

  deploy-qa:
    name: Deploy → QA + benchmark gate
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'dev')
    environment: qa
    env:
      DATABRICKS_HOST: ${{ vars.QA_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.QA_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.QA_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml --quiet

      - name: Point the space at the QA catalog
        run: python scripts/set_catalog.py qa

      - name: bundle deploy -t qa
        run: databricks bundle deploy -t qa

      # Runs every benchmark question in the QA space and compares Genie's answers with the expected SQL.
      - name: Genie benchmark gate
        env:
          ACCURACY_THRESHOLD: "0.60"   # share of the automatically graded benchmarks that must be "Good"
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t qa -o json \
            | jq -r '.resources.genie_spaces.genie_space.id')
          python tests/benchmark_gate.py

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    environment: prod   # ← manual approval gate lives here
    env:
      DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.PROD_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml --quiet

      - name: Point the space at the prod catalog
        run: python scripts/set_catalog.py prod

      # Adopting an existing space keeps its id, URL and conversation history. The prod service principal
      # needs CAN_MANAGE on that space (its owner grants it in the space's Share dialog).
      - name: Adopt an existing prod space (adopt_space_id)
        env:
          ADOPT_SPACE_ID: ${{ inputs.adopt_space_id }}
        run: |
          if [ -n "$ADOPT_SPACE_ID" ]; then
            databricks bundle deployment bind genie_space "$ADOPT_SPACE_ID" --auto-approve -t prod
          fi

      - name: bundle plan -t prod
        run: databricks bundle plan -t prod

      - name: bundle deploy -t prod
        run: databricks bundle deploy -t prod

      - name: Smoke test (conversation API)
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t prod -o json \
            | jq -r '.resources.genie_spaces.genie_space.id')
          python tests/smoke_test.py
