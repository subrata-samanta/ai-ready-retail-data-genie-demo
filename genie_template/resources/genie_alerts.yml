# SQL alerts on the monitoring tables. They run where alerts_pause_status is UNPAUSED (prod, genie.config.yml)
# and notify alert_subscribers. Thresholds come from genie.config.yml.
#
#   accuracy  the latest benchmark run scored below gate_min_accuracy (or the gate failed)
#   stale     no quality run in the last 26 hours: the nightly monitor itself is not running
#   answers   more than alert_max_failed_share of the last day's questions failed or got a thumbs down
resources:
  alerts:
    genie_accuracy:
      display_name: ${var.space_title} · accuracy below the gate${var.title_suffix}
      warehouse_id: ${var.warehouse_id}
      query_text: >-
        SELECT CASE WHEN passed THEN 0 ELSE 1 END AS failed, accuracy
        FROM ${var.catalog}.${var.monitoring_schema}.genie_quality_runs
        WHERE mode = 'gate' AND target = '${bundle.target}'
        ORDER BY checked_at DESC LIMIT 1
      custom_summary: "Genie space ${var.space_title}: the latest quality run failed ({{ALERT_STATUS}})"
      custom_description: >-
        See genie_quality_runs.reasons and genie_quality_results in ${var.catalog}.${var.monitoring_schema}, and the
        runbook (docs/OPERATIONS.md). Owner ${var.technical_owner}.
      evaluation:
        source:
          name: failed
          display: failed
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscribers}
      schedule:
        quartz_cron_schedule: "0 30 * * * ?"
        timezone_id: ${var.monitor_timezone}
        pause_status: ${var.alerts_pause_status}

    genie_monitoring_stale:
      display_name: ${var.space_title} · monitoring stale${var.title_suffix}
      warehouse_id: ${var.warehouse_id}
      query_text: >-
        SELECT COALESCE(timestampdiff(HOUR, MAX(checked_at), current_timestamp()), 9999) AS hours_since_last_run
        FROM ${var.catalog}.${var.monitoring_schema}.genie_quality_runs
        WHERE mode = 'gate' AND target = '${bundle.target}'
      custom_summary: "Genie space ${var.space_title}: no quality run for {{QUERY_RESULT_VALUE}} hours"
      evaluation:
        source:
          name: hours_since_last_run
          display: hours_since_last_run
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 26
        empty_result_state: TRIGGERED
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscribers}
      schedule:
        quartz_cron_schedule: "0 0 * * * ?"
        timezone_id: ${var.monitor_timezone}
        pause_status: ${var.alerts_pause_status}

    genie_failed_answers:
      display_name: ${var.space_title} · failing answers${var.title_suffix}
      warehouse_id: ${var.warehouse_id}
      query_text: >-
        SELECT COALESCE(AVG(CASE WHEN status <> 'COMPLETED' OR feedback_rating = 'NEGATIVE' THEN 1.0 ELSE 0.0 END), 0)
               AS failed_share
        FROM ${var.catalog}.${var.monitoring_schema}.genie_usage_messages
        WHERE target = '${bundle.target}' AND created_at >= current_timestamp() - INTERVAL 24 HOURS
      custom_summary: "Genie space ${var.space_title}: {{QUERY_RESULT_VALUE}} of the last day's questions failed"
      evaluation:
        source:
          name: failed_share
          display: failed_share
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: ${var.alert_max_failed_share}
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions: ${var.alert_subscribers}
      schedule:
        quartz_cron_schedule: "0 15 7 * * ?"
        timezone_id: ${var.monitor_timezone}
        pause_status: ${var.alerts_pause_status}
