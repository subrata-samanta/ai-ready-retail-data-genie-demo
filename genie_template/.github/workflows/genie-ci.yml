# Checks on every pull request (and every push to main). Make "checks" a required status check on main
# (the setup notebook does this).
#
#   checks   no workspace needed: template tests, the space definition is valid and canonical, the notebooks
#            are up to date, and the reviewer gets the list of changes in the space (job summary)
#   bundle   with the dev environment's credentials: databricks bundle validate and plan for dev
#            (skipped with a notice until the GitHub environment dev has DATABRICKS_HOST)
name: genie-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write                              # GitHub OIDC token for Databricks (bundle job)

env:
  DATABRICKS_CLI_VERSION: "1.18.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # the base branch, for the change list
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Template tests
        run: python tests/run_tests.py
      - name: Validate the space definition
        run: python scripts/validate_space.py
      - name: Notebooks are up to date
        run: python scripts/build_notebooks.py --check
      - name: What changed in the Genie space
        if: github.event_name == 'pull_request'
        run: python scripts/validate_space.py --diff-against "origin/${{ github.base_ref }}"

  bundle:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then echo "::notice::dev is not connected (no DATABRICKS_HOST); bundle checks skipped"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: bundle validate and plan (dev)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          databricks bundle validate -t dev
          databricks bundle plan -t dev
