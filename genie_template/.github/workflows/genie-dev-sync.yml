# Version every change made in the dev Genie UI.
#
# Hourly, on demand, and at the start of every release:
#   1. scripts/sync_from_workspace.py -t dev   exports the dev space into space/genie_space.yml
#      (nothing to do until the first release has deployed dev)
#   2. if it changed: commit it on the branch genie/dev-sync, tag the commit genie-dev-snapshot-<UTC time>
#      (dev's version history: every snapshot can be restored with genie-rollback), open or update a pull request
#
# Pull requests created with the default GITHUB_TOKEN don't trigger other workflows. To run genie-ci on the sync
# pull request automatically, store a GitHub App token or fine-grained token as the secret GENIE_SYNC_TOKEN.
name: genie-dev-sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: genie-dev-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET && 'oauth-m2m' || 'github-oidc' }}
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GENIE_SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GENIE_SYNC_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
        with:
          version: "1.18.0"
      - run: pip install -r requirements-dev.txt
      - id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then echo "::notice::dev is not connected (no DATABRICKS_HOST); nothing to sync"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Export the dev space
        if: steps.cfg.outputs.ready == 'true'
        run: python scripts/sync_from_workspace.py -t dev
      - name: Commit, tag and open the sync pull request
        if: steps.cfg.outputs.ready == 'true'
        run: |
          FILE=space/genie_space.yml
          if git diff --quiet -- "$FILE"; then echo "dev matches $BASE"; exit 0; fi
          python scripts/validate_space.py || echo "::warning::the dev space has validation errors; see the PR checks"
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          git config user.name "genie-dev-sync"
          git config user.email "genie-dev-sync@users.noreply.github.com"
          git checkout -B genie/dev-sync
          git add "$FILE"
          git commit -m "Genie: changes made in the dev space (snapshot $STAMP)"
          git tag "genie-dev-snapshot-$STAMP"
          git push --force origin genie/dev-sync
          git push origin "genie-dev-snapshot-$STAMP"
          gh pr view genie/dev-sync >/dev/null 2>&1 || gh pr create --base "$BASE" --head genie/dev-sync \
            --title "Genie: sync changes made in dev" \
            --body "Changes made in the dev Genie space UI, exported by genie-dev-sync. Review the change list in the checks, then merge to release them to qa and prod."
          echo "Snapshot genie-dev-snapshot-$STAMP" >> "$GITHUB_STEP_SUMMARY"
