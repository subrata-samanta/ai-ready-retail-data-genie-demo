# Builds the whole data product in order. Every step can be re-run safely.
#   setup     schemas, landing volume, governance functions (the pipeline's column mask needs them)
#   pipeline  bronze + silver (the pipeline above)
#   gold      gold tables (created if missing) and MERGE loads
#   security  row filters on the facts, grants for Genie users
#   semantic  metric views and the like-for-like function
# src/run_sql.py runs the SQL files, replacing ${catalog} and ${as_of_date}.
resources:
  jobs:
    freshcart_refresh:
      name: FreshCart data refresh${var.title_suffix}
      description: Setup, bronze and silver pipeline, gold loads, security and semantic layer for ${var.catalog}.
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters: [--catalog, "${var.catalog}", --as-of-date, "${var.as_of_date}",
                         "${workspace.file_path}/00_setup.sql",
                         "${workspace.file_path}/governance/00_functions.sql"]

        - task_key: pipeline
          depends_on: [{task_key: setup}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.freshcart_pipeline.id}

        - task_key: gold
          depends_on: [{task_key: pipeline}]
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters: [--catalog, "${var.catalog}", --as-of-date, "${var.as_of_date}",
                         "${workspace.file_path}/gold/00_create_gold_tables.sql",
                         "${workspace.file_path}/gold/01_load_gold.sql"]

        - task_key: security
          depends_on: [{task_key: gold}]
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters: [--catalog, "${var.catalog}", --as-of-date, "${var.as_of_date}",
                         "${workspace.file_path}/governance/01_security.sql"]

        - task_key: semantic
          depends_on: [{task_key: gold}]
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters: [--catalog, "${var.catalog}", --as-of-date, "${var.as_of_date}",
                         "${workspace.file_path}/semantic/02_metric_views.sql",
                         "${workspace.file_path}/semantic/03_fn_like_for_like_sales.sql"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
